<svg width="560" height="78" viewBox="0 0 560 78" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harry Joshi">
  <defs>
    <linearGradient id="nameGradient" x1="-520" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="0.35" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#1F6FEB"/>
      <animate attributeName="x1" values="-520;560" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="120;1200" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-12" y="-12" width="584" height="102" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1F6FEB" flood-opacity="0.4"/>
    </filter>
  </defs>
  <text x="0" y="56" fill="url(#nameGradient)" filter="url(#softGlow)"
        font-family="Space Grotesk, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="48" font-weight="800" letter-spacing="0">
    Harry Joshi
  </text>
</svg>
