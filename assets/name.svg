<svg width="430" height="72" viewBox="0 0 430 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harry Joshi">
  <defs>
    <linearGradient id="nameGradient" x1="-360" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="0.35" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#1F6FEB"/>
      <animate attributeName="x1" values="-360;390" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80;830" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-20" y="-18" width="470" height="110" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#1F6FEB" flood-opacity="0.4"/>
    </filter>
  </defs>
  <text x="0" y="50" fill="url(#nameGradient)" filter="url(#softGlow)" text-anchor="start"
        font-family="Space Grotesk, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="60" font-weight="800" letter-spacing="0">
    Harry Joshi
  </text>
</svg>
